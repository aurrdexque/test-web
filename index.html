<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ManadoChess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{ --bg:#0f1713; --panel:#142219; --panel2:#0f1a14; --line:#1d3728; --ink:#e8f5ec; --muted:#bad9c4; --brand:#2ea043; --brand2:#1f7a31; --pill:#d62828; }
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1600px 800px at 0% -10%, #163122 0%, #0f1713 50%) fixed,var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
a{color:#e9fff3;text-decoration:none} a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(15,23,19,.92),rgba(15,23,19,.7));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.nav{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:40px}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:12px;color:#e8f5ec;font-weight:800}
.tab.active{border-color:var(--brand);box-shadow:0 6px 18px rgba(46,160,67,.28)}
.container{max-width:1200px;margin:16px auto;padding:0 14px 64px}
.card{background:linear-gradient(180deg,#15261d,#0f1a14);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);margin:12px 0;overflow:hidden}
.card .head{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#2f8c3e,#256f31);padding:10px 14px;font-weight:800}
.card .body{padding:12px 14px}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0 8px}
thead th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:0 10px 6px;text-align:left}
tbody td{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px}
tbody td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
tbody td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.row-alt td{background:#0f1a14}

/* badges */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#163c26;border:1px solid #2c6a42}
.badge-title{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--pill);color:#fff;font-weight:900;font-size:12px;letter-spacing:.3px;margin-right:6px;box-shadow:0 6px 14px rgba(214,40,40,.35)}
.name{font-weight:700}
.muted{color:var(--muted)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:linear-gradient(90deg,#2ea043,#1f7a31);border:0;color:#08130c;font-weight:900;padding:10px 14px;border-radius:12px;cursor:pointer}

/* >>> Brighter, larger tournament chips for mobile readability <<< */
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:15px; font-weight:900; letter-spacing:.2px;
  color:#f4fff9; text-shadow:0 1px 0 rgba(0,0,0,.45);
  background:linear-gradient(180deg,#36b35d,#238a46);
  border:2px solid #55df86; border-radius:999px;
  padding:10px 14px; box-shadow:0 6px 18px rgba(54,179,93,.25);
}
.tag:hover{filter:brightness(1.06)}

/* Mobile tweaks */
@media (max-width: 600px){
  .tag{font-size:16px;padding:12px 16px;border-width:2px}
  .flex{gap:12px}
}

.pill{margin-left:auto;background:#8bc34a;color:#122116;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:900}
.tabs2{display:flex;gap:8px;margin:8px 0}
.tab2{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#0f1a14;cursor:pointer}
.tab2.active{border-color:#2ea043;box-shadow:0 0 0 2px rgba(46,160,67,.25) inset}
.round{background:#0f1a14;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.round h4{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);background:#132219}
.game{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px dashed #21392a}
.game:last-child{border-bottom:0}
.delta.plus{color:#9ef3b8;font-weight:800}
.delta.minus{color:#ffb4b4;font-weight:800}
.player-link{color:inherit;text-decoration:none}
.player-link:hover{text-decoration:underline}
.chartWrap{background:#0f1a14;border:1px solid var(--line);border-radius:12px;padding:12px}
.small{font-size:12px}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand"><img src="Picture1.png" alt="logo"></div>
    <div class="tabs">
      <a class="tab" href="#/leaderboard" id="tab-lead">Leaderboard</a>
      <a class="tab" href="#/tournaments" id="tab-tour">Tournaments</a>
    </div>
  </div>
</header>
<div class="container" id="app"></div>
<script>
// ===== Helpers =====
const TITLE_RX=/^(GM|IM|FM|NM|CM|WGM|WIM|WFM|WCM|PM)\.?\s+/i; const K=24,R0=1800;
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const nkey=s=>String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
function splitTitlePrefix(name){ const s=String(name||'').trim(); const m=s.match(TITLE_RX); return m?{title:m[1].toUpperCase(),rest:s.replace(TITLE_RX,'').trim()}:{title:null,rest:s}; }
function renderNameWithBadge(raw,titles){ const {title:pref,rest}=splitTitlePrefix(raw); const mapped=titles[rest]||titles[raw]||null; const t=pref||(mapped?String(mapped).toUpperCase():null); return t?`<span class="badge-title">${t}</span> ${esc(rest)}`:esc(raw); }
function expected(ra,rb){return 1/(1+Math.pow(10,(rb-ra)/400));}
function resToScore(r,white=true){ if(r==='1-0') return white?1:0; if(r==='0-1') return white?0:1; return 0.5; }

// ===== Data =====
const DATA={players:[],titles:{},aliases:{},tournaments:[],ratingsMap:new Map(),gamesMap:new Map()};

async function loadJSON(){
  const r=await fetch('manadochess.json?ts='+Date.now(),{cache:'no-store'});
    // === Compute last-updated string (viewer local time) ===
    let __lastMod = r.headers.get('Last-Modified');
    try {
      const __head = await fetch('manadochess.json', { method: 'HEAD', cache: 'no-store' });
      const __hm = __head.headers.get('Last-Modified');
      if (__hm) __lastMod = __hm;
    } catch(e) {}
    if (__lastMod) {
      try {
        const __dt = new Date(__lastMod);
        const __fmt = new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
        window.LAST_UPDATED_STR = 'Updated ' + __fmt.format(__dt);
      } catch(e) {
        window.LAST_UPDATED_STR = 'Updated ' + __lastMod;
      }
    } else {
      window.LAST_UPDATED_STR = 'Updated just now';
    }
 if(!r.ok) throw new Error('Failed to load manadochess.json');
  const raw=await r.json();
  // Load optional manual ratings & games maps from JSON
  try{
    const rmap = raw.ratings ? new Map(Object.entries(raw.ratings)) : new Map();
    const gmap = raw.games ? new Map(Object.entries(raw.games)) : new Map();
    DATA.ratingsMap = rmap; DATA.gamesMap = gmap;
  }catch(e){ DATA.ratingsMap=new Map(); DATA.gamesMap=new Map(); }
  
  const tmap={...(raw.titles||{})}; for(const p of (raw.players||[])){ if(p&&p.name&&p.title) tmap[p.name]=p.title; }
  DATA.titles=tmap; DATA.aliases=raw.aliases||{}; DATA.players=raw.players||[];
  DATA.tournaments = normalizeTournaments(raw.tournaments||[]);
}

function resolveAlias(name){ const rest=splitTitlePrefix(name).rest; const base=nkey(rest); const mapped=DATA.aliases[base]; const out=(typeof mapped==='string' && mapped.trim())?mapped.trim():rest; return out; }

// Accept W/B/R or white/black/result. Merge by name, auto-round, de-dupe identical rounds.
function normalizeTournaments(rawT){
  const groups=new Map(); for(const t of rawT){ (groups.get(t.name)||groups.set(t.name,[]).get(t.name)).push(t); }
  const out=[]; for(const [name,arr] of groups){ arr.sort((a,b)=> +new Date(a.at||0) - +new Date(b.at||0)); const T={name,rounds:[]}; const seen=new Set(); let counter=1; for(const t of arr){ if(Array.isArray(t.rounds)){ for(const r of t.rounds){ const games=(r.games||[]).map(g=>({white:g.white??g.W??'',black:g.black??g.B??'',result:g.result??g.R??''})); const key=buildRoundKey(games); if(seen.has(key)) continue; seen.add(key); T.rounds.push({round:String(r.round??counter++),games}); } } else if(t.games){ const games=(t.games||[]).map(g=>({white:g.white??g.W??'',black:g.black??g.B??'',result:g.result??g.R??''})); let rlabel=''; const uniq=new Set((t.games||[]).map(g=>String(g.round||'').trim()).filter(Boolean)); if(uniq.size===1) rlabel=[...uniq][0]; if(!rlabel) rlabel=String(counter); const key=buildRoundKey(games); if(seen.has(key)) continue; seen.add(key); T.rounds.push({round:rlabel,games}); counter++; } } T.rounds.sort((a,b)=>(parseFloat(a.round)||0)-(parseFloat(b.round)||0)||String(a.round).localeCompare(String(b.round))); out.push(T);} return out; }
function buildRoundKey(games){ return games.map(g=>`${nkey(splitTitlePrefix(g.white).rest)}#${nkey(splitTitlePrefix(g.black).rest)}#${String(g.result||'').trim()}#`).sort().join('|'); }

function computeRatings(){ const rating=new Map(),gameInfo=[],timeline=new Map(); let gidx=0; for(const T of DATA.tournaments){ for(const R of T.rounds){ for(const G of R.games){ const W=resolveAlias(G.white),B=resolveAlias(G.black); const Rsl=String(G.result||'').trim(); if(!W||!B||!Rsl) continue; const rW=rating.get(W)??R0,rB=rating.get(B)??R0; const Ew=expected(rW,rB),Sw=resToScore(Rsl,true); const dW=K*(Sw-Ew), dB=-dW; const rW2=rW+dW,rB2=rB+dB; rating.set(W,rW2); rating.set(B,rB2); (timeline.get(W)||timeline.set(W,[]).get(W)).push({idx:gidx,rating:rW2}); (timeline.get(B)||timeline.set(B,[]).get(B)).push({idx:gidx,rating:rB2}); gameInfo.push({tname:T.name,round:R.round,white:W,black:B,result:Rsl,wPre:rW,bPre:rB,wPost:rW2,bPost:rB2,wDelta:dW,bDelta:dB,index:gidx}); gidx++; } } } return {rating,gameInfo,timeline}; }

function countGamesAll(){ const m=new Map(); for(const T of DATA.tournaments){ for(const R of T.rounds){ for(const G of R.games){ const W=resolveAlias(G.white),B=resolveAlias(G.black); const Rsl=String(G.result||'').trim(); if(!W||!B||!Rsl) continue; m.set(W,(m.get(W)||0)+1); m.set(B,(m.get(B)||0)+1); } } } return m; }

function computeStandings(T){ const pts=new Map(),opp=new Map(),names=new Set(); for(const R of T.rounds){ for(const G of R.games){ const W=resolveAlias(G.white),B=resolveAlias(G.black); const Rsl=String(G.result||'').trim(); if(!W||!B||!Rsl) continue; names.add(W); names.add(B); const sw=resToScore(Rsl,true),sb=resToScore(Rsl,false); pts.set(W,(pts.get(W)||0)+sw); pts.set(B,(pts.get(B)||0)+sb); (opp.get(W)||opp.set(W,[]).get(W)).push({o:B,s:sw}); (opp.get(B)||opp.set(B,[]).get(B)).push({o:W,s:sb}); } } const list=Array.from(names).map(n=>({name:n,points:+(pts.get(n)||0).toFixed(2)})); function TB1(g){ const set=new Set(g.map(x=>x.name)); const m=new Map(); for(const p of g){ let s=0; for(const x of (opp.get(p.name)||[])){ if(set.has(x.o)) s+=x.s; } m.set(p.name,+s.toFixed(2)); } return m; } function TB2(g){ const m=new Map(); for(const p of g){ let s=0; for(const x of (opp.get(p.name)||[])){ s+=(pts.get(x.o)||0); } m.set(p.name,+s.toFixed(2)); } return m; } function TB3(g){ const m=new Map(); for(const p of g){ let s=0; for(const x of (opp.get(p.name)||[])){ s+=(pts.get(x.o)||0)*x.s; } m.set(p.name,+s.toFixed(2)); } return m; } list.sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name)); const ranked=[]; for(let i=0;i<list.length;){ let j=i+1; while(j<list.length && Math.abs(list[j].points-list[i].points)<1e-9) j++; const g=list.slice(i,j); const de=TB1(g),bh=TB2(g),sb=TB3(g); g.sort((a,b)=> (de.get(b.name)-de.get(a.name))||(bh.get(b.name)-bh.get(a.name))||(sb.get(b.name)-sb.get(a.name))||a.name.localeCompare(b.name)); for(const x of g){ ranked.push({name:x.name,points:x.points,tb1:de.get(x.name),tb2:bh.get(x.name),tb3:sb.get(x.name)}); } i=j; } ranked.forEach((r,k)=>r.rank=k+1); return ranked; }

// ===== Views =====
function renderLeaderboard(rating){ const arr=Array.from(rating.entries()).map(([n,r])=>({name:n,rating:r})).sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name)); let html=`<div class=\"card\"><div class=\"head\">Leaderboard <span class=\"pill\">${window.LAST_UPDATED_STR || ""}</span></div><div class=\"body\"><table><thead><tr><th style=\"width:64px\">Rank</th><th>Player</th><th style=\"width:90px\">Games</th><th style=\"width:120px\">Rating</th></tr></thead><tbody>`; const games=countGamesAll(); arr.forEach((p,i)=>{ html+=`<tr class=\"${i%2?'row-alt':''}\"><td style=\"text-align:center;font-weight:800\">${i+1}</td><td class=\"name\"><a class=\"player-link\" href=\"#/player/${encodeURIComponent(p.name)}\">${renderNameWithBadge(p.name,DATA.titles)}</a></td><td style=\"text-align:right\"><span class=\"badge\">${games.get(p.name)||0}</span></td><td style=\"text-align:right\"><span class=\"badge\">${Math.round(p.rating)}</span></td></tr>`; }); if(!arr.length){ html+=`<tr><td colspan=\"4\" class=\"muted\">No data found. Make sure <code>manadochess.json</code> is in the same folder.</td></tr>`;} html+=`</tbody></table></div></div>`; return html; }

function renderTournaments(){ let html=`<div class=\"card\"><div class=\"head\">Tournaments <span class=\"pill\">${DATA.tournaments.length}</span></div><div class=\"body\"><div class=\"flex\">`; DATA.tournaments.forEach((t,i)=>{ const rounds=t.rounds.length; html+=`<a class=\"tag\" href=\"#/t/${i}\">${esc(t.name)} • ${rounds} round${rounds!==1?'s':''}</a>`; }); html+=`</div></div></div>`; return html; }

function renderTournament(idx){ const T=DATA.tournaments[idx]; if(!T) return `<div class=\"card\"><div class=\"head\">Tournament</div><div class=\"body\">Not found.</div></div>`; let html=`<div class=\"card\"><div class=\"head\">${esc(T.name)} <span class=\"pill\">${T.rounds.length} rounds</span></div><div class=\"body\">`; html+=`<div class=\"tabs2\"><a class=\"tab2 active\" href=\"#/t/${idx}/standings\" id=\"tab-stand\">Standings</a><a class=\"tab2\" href=\"#/t/${idx}/games\" id=\"tab-games\">Games</a></div>`; const hash=location.hash||''; if(hash.includes('/games')){ const {gameInfo}=computeRatings(); const rows=gameInfo.filter(g=>g.tname===T.name); const by=new Map(); for(const g of rows){ (by.get(g.round)||by.set(g.round,[]).get(g.round)).push(g); } const rounds=Array.from(by.keys()).sort((a,b)=>(parseFloat(a)||0)-(parseFloat(b)||0)||String(a).localeCompare(String(b))); for(const r of rounds){ html+=`<div class=\"round\"><h4>Round ${esc(r)}</h4>`; for(const g of by.get(r)){ const wD=Math.round(g.wDelta*10)/10, bD=Math.round(g.bDelta*10)/10; const d1=wD>=0?`<span class=\"delta plus\">+${wD}</span>`:`<span class=\"delta minus\">${wD}</span>`; const d2=bD>=0?`<span class=\"delta plus\">+${bD}</span>`:`<span class=\"delta minus\">${bD}</span>`; html+=`<div class=\"game\"><div class=\"name\"><a class=\"player-link\" href=\"#/player/${encodeURIComponent(g.white)}\">${renderNameWithBadge(g.white,DATA.titles)}</a> (${Math.round(g.wPre)})</div><div class=\"muted\">vs</div><div class=\"name\"><a class=\"player-link\" href=\"#/player/${encodeURIComponent(g.black)}\">${renderNameWithBadge(g.black,DATA.titles)}</a> (${Math.round(g.bPre)})</div><div class=\"muted\">—</div><div><strong>${g.result}</strong></div><div class=\"muted\">•</div><div>Δ ${d1} / ${d2}</div></div>`; } html+=`</div>`; } } else { const S=computeStandings(T); html+=`<div><table><thead><tr><th style=\"width:64px\">Rank</th><th>Player</th><th style=\"width:90px\">Points</th><th style=\"width:120px\">TB1: Direct</th><th style=\"width:160px\">TB2: Buchholz</th><th style=\"width:160px\">TB3: Sonneborn-Berger</th></tr></thead><tbody>`; S.forEach((p,i)=>{ html+=`<tr class=\"${i%2?'row-alt':''}\"><td style=\"text-align:center;font-weight:800\">${p.rank}</td><td class=\"name\"><a class=\"player-link\" href=\"#/player/${encodeURIComponent(p.name)}\">${renderNameWithBadge(p.name,DATA.titles)}</a></td><td style=\"text-align:right\"><span class=\"badge\">${p.points.toFixed(1)}</span></td><td style=\"text-align:right\"><span class=\"badge\">${p.tb1.toFixed(1)}</span></td><td style=\"text-align:right\"><span class=\"badge\">${p.tb2.toFixed(1)}</span></td><td style=\"text-align:right\"><span class=\"badge\">${p.tb3.toFixed(1)}</span></td></tr>`; }); html+=`</tbody></table><div class=\"small muted\" style=\"margin-top:8px\">Tiebreak order: TB1 Direct Encounter, TB2 Buchholz, TB3 Sonneborn–Berger.</div></div>`; } html+=`</div></div>`; return html; }

function renderPlayer(name,computed){ const {rating,gameInfo,timeline,uiRating}=computed; const base = uiRating||rating; const now=Math.round((base.get(name)??R0)); const games=gameInfo.filter(g=>g.white===name||g.black===name); let W=0,D=0,L=0,WB=0,WW=0; const oppScore=new Map(); let best=null,worst=null; for(const g of games){ const w=(g.white===name); const s=resToScore(g.result,w); if(s===1) W++; else if(s===.5) D++; else L++; if(w) WW++; else WB++; const d=w?g.wDelta:g.bDelta; if(best==null||d>best.delta) best={delta:d,opp:w?g.black:g.white,when:`${g.tname} R${g.round}`}; if(worst==null||d<worst.delta) worst={delta:d,opp:w?g.black:g.white,when:`${g.tname} R${g.round}`}; const opp=w?g.black:g.white; const rec=oppScore.get(opp)||{score:0,games:0}; rec.score+=s; rec.games+=1; oppScore.set(opp,rec); } let nem=null,fav=null; for(const [opp,rec] of oppScore.entries()){ const r=rec.score/rec.games; if(nem==null||r<nem.ratio||(r===nem.ratio&&rec.games>nem.games)) nem={opp,ratio:r,games:rec.games}; if(fav==null||r>fav.ratio||(r===fav.ratio&&rec.games>fav.games)) fav={opp,ratio:r,games:rec.games}; } let html=`<div class=\"card\"><div class=\"head\">${renderNameWithBadge(name,DATA.titles)} <span class=\"pill\">Current rating ${now}</span></div><div class=\"body\">`; html+=`<div class=\"flex\"><div class=\"tag\">Games: ${games.length}</div><div class=\"tag\">W ${W} • D ${D} • L ${L}</div><div class=\"tag\">White ${WW} • Black ${WB}</div></div>`; if(best){ html+=`<div class=\"flex\" style=\"margin-top:8px\"><div class=\"tag\">Greatest performance: +${(Math.round(best.delta*10)/10)} vs <a class=\"player-link\" href=\"#/player/${encodeURIComponent(best.opp)}\">${renderNameWithBadge(best.opp,DATA.titles)}</a> <span class=\"muted\">(${esc(best.when)})</span></div><div class=\"tag\">Worst performance: ${(Math.round(worst.delta*10)/10)} vs <a class=\"player-link\" href=\"#/player/${encodeURIComponent(worst.opp)}\">${renderNameWithBadge(worst.opp,DATA.titles)}</a> <span class=\"muted\">(${esc(worst.when)})</span></div></div>`; } if(nem){ html+=`<div class=\"flex\" style=\"margin-top:8px\"><div class=\"tag\">Nemesis: <a class=\"player-link\" href=\"#/player/${encodeURIComponent(nem.opp)}\">${renderNameWithBadge(nem.opp,DATA.titles)}</a> <span class=\"muted\">(${(nem.ratio*100).toFixed(0)}% over ${nem.games} game${nem.games!==1?'s':''})</span></div><div class=\"tag\">Favorite victim: <a class=\"player-link\" href=\"#/player/${encodeURIComponent(fav.opp)}\">${renderNameWithBadge(fav.opp,DATA.titles)}</a> <span class=\"muted\">(${(fav.ratio*100).toFixed(0)}% over ${fav.games} game${fav.games!==1?'s':''})</span></div></div>`; } html+=`<div class=\"chartWrap\" style=\"margin-top:12px\"><canvas id=\"rtChart\" height=\"120\"></canvas></div></div></div>`; html+=`<div class=\"card\"><div class=\"head\">Games</div><div class=\"body\">`; games.slice().reverse().forEach(g=>{ const w=(g.white===name); const opp=w?g.black:g.white; const d=Math.round((w?g.wDelta:g.bDelta)*10)/10; const cls=d>=0?'plus':'minus'; html+=`<div class=\"game\"><div class=\"name\">${w?'White':'Black'} vs <a class=\"player-link\" href=\"#/player/${encodeURIComponent(opp)}\">${renderNameWithBadge(opp,DATA.titles)}</a></div><div class=\"muted\">—</div><div><strong>${g.result}</strong></div><div class=\"muted\">•</div><div class=\"delta ${cls}\">${d>=0?'+':''}${d}</div><div class=\"muted\">•</div><div class=\"muted small\">${esc(g.tname)} R${esc(g.round)}</div></div>`; }); html+=`</div></div>`; requestAnimationFrame(()=>{ const el=document.getElementById('rtChart'); if(!el) return; const t=(computed?.timeline?.get(name)) || new Map().get(name) || []; const labels=t.map(x=>x.idx+1); const series=t.map(x=>Math.round(x.rating)); new Chart(el.getContext('2d'),{type:'line',data:{labels,datasets:[{label:'Rating',data:series}]},options:{responsive:true,scales:{x:{display:false}},plugins:{legend:{display:false}}}}); }); return html; }

// ===== Router =====
function setActiveTab(hash){ document.getElementById('tab-lead').classList.toggle('active',hash.startsWith('#/leaderboard')||hash===''); document.getElementById('tab-tour').classList.toggle('active',hash.startsWith('#/tournaments')||hash.startsWith('#/t/')); }
async function render(){ const app=document.getElementById('app'); const hash=location.hash||'#/leaderboard'; setActiveTab(hash); const computed=computeRatings();
  // Prefer manual ratings from JSON if provided
  const ratingForUI = (DATA.ratingsMap && DATA.ratingsMap.size) ? DATA.ratingsMap : computed.rating; if(hash.startsWith('#/t/')){ const parts=hash.split('/'); const idx=parseInt(parts[2]||'0'); const sub=parts[3]||'standings'; app.innerHTML=renderTournament(idx); const s=document.getElementById('tab-stand'); const g=document.getElementById('tab-games'); if(s&&g){ s.classList.toggle('active',sub==='standings'); g.classList.toggle('active',sub==='games'); } return; } if(hash.startsWith('#/tournaments')){ app.innerHTML=renderTournaments(); return; } if(hash.startsWith('#/player/')){ const name=decodeURIComponent(hash.replace('#/player/','')); app.innerHTML=renderPlayer(name,{...computed, uiRating: ratingForUI}); return; } app.innerHTML=renderLeaderboard(ratingForUI); }
window.addEventListener('hashchange',render);
(async function init(){ try{ await loadJSON(); await render(); } catch(e){ document.getElementById('app').innerHTML=`<div class='card'><div class='head'>Error</div><div class='body'>${esc(e.message||String(e))}</div></div>`; } })();
</script>
